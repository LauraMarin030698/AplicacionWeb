<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Aplicación Web</title>

  <!-- Fuente Google -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #333;
    }

    header {
      background: #1e88e5;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    button {
      background: #1e88e5;
      border: none;
      padding: 12px 20px;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1565c0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #eee;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>MiApp</h2>
  <nav>
    <a href="#">Inicio</a>
    <a href="#">Servicios</a>
    <a href="#">Contacto</a>
  </nav>
</header>

<section class="hero">
  <h1>Bienvenida a tu Aplicación Web 🚀</h1>
  <p>Base inicial para conectar APIs, backend y autenticación.</p>
  <button onclick="saludar()">Probar Aplicación</button>
</section>

<div class="container">
  <div class="card">
    <h3>Estado de la App</h3>
    <p id="mensaje">Esperando acción del usuario...</p>
  </div>
</div>

<footer>
  <p>© 2026 Mi Aplicación Web</p>
</footer>

<script>
  function saludar() {
    document.getElementById("mensaje").innerText =
      "✅ Aplicación funcionando correctamente!";
  }
</script>

</body>
</html>
